name: Build Kernel - WSA

on:
  workflow_dispatch:
    inputs:
      kernel_build_version:
        description: "Kernel family"
        type: choice
        options:
          - "5.15.x"
        default: "5.15.x"

      os_patch_level:
        description: "WSA patch level (example: 104.4, 104.5, 94.2, or 2025-01 style label)"
        type: string
        default: "104.4"

      brand_name:
        description: "Kernel branding"
        type: string
        default: "WSA"

      release_type:
        description: "Release type"
        type: choice
        options:
          - "Action"
          - "Pre-Release"
          - "Release"
        default: "Action"

      use_cache:
        description: "Use compiler cache"
        type: boolean
        default: true

      root_flavor:
        description: "Root flavor"
        type: choice
        options:
          - "KernelSU-Next"
          - "KernelSU"
          - "BakaSU"
          - "FinaSU"
          - "SukiSU-Ultra"
          - "KowSU"
          - "No Root"
        default: "KernelSU-Next"

      commit_mode:
        description: "Commit mode"
        type: choice
        options:
          - "verified"
          - "latest"
          - "update"
        default: "verified"

      build_features:
        description: "Feature set"
        type: choice
        options:
          - "default"
          - "minimal"
          - "custom"
        default: "default"

  push:
    branches: ["main", "ci", "checkci"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - ".github/workflows/wsa-kernel.yml"
      - "kernel/**"

  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - ".github/workflows/wsa-kernel.yml"
      - "kernel/**"

  workflow_call:
    inputs:
      kernel_build_version:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      brand_name:
        required: false
        type: string
        default: "WSA"
      release_type:
        required: false
        type: string
        default: "Action"
      use_cache:
        required: false
        type: boolean
        default: true
      root_flavor:
        required: false
        type: string
        default: "KernelSU-Next"
      commit_mode:
        required: false
        type: string
        default: "verified"
      build_features:
        required: false
        type: string
        default: "default"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_label: ${{ steps.resolve.outputs.version_label }}
      build_tag: ${{ steps.resolve.outputs.build_tag }}

    steps:
      - name: Resolve WSA version
        id: resolve
        shell: bash
        run: |
          set -euxo pipefail

          INPUT="${{ inputs.os_patch_level }}"
          INPUT="${INPUT:-104.4}"

          if [[ "$INPUT" =~ ^5\.15\..* ]]; then
            VERSION="$INPUT"
          elif [[ "$INPUT" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            VERSION="5.15.${INPUT}"
          elif [[ "$INPUT" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            VERSION="5.15.104.4"
          else
            VERSION="5.15.${INPUT}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_tag=WSA-${VERSION}-x86_64" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/wsa-kernel.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch: "x86_64"
      brand_name: ${{ inputs.brand_name || 'WSA' }}
      root_flavor: ${{ inputs.root_flavor || 'KernelSU-Next' }}
      commit_mode: ${{ inputs.commit_mode || 'verified' }}
      use_cache: ${{ inputs.use_cache || true }}
      release_type: ${{ inputs.release_type || 'Action' }}
      build_features: ${{ inputs.build_features || 'default' }}
