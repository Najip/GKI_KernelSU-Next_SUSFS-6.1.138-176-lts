name: Build Kernel - WSA (5.15 x86_64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WSA kernel version (example: 5.15.104.4)"
        required: true
        default: "5.15.104.4"
        type: string
  push:
    branches: ["main", "ci", "checkci"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - ".github/workflows/wsa-kernel.yml"
      - "kernel/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - ".github/workflows/wsa-kernel.yml"
      - "kernel/**"
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/wsa-kernel.yml
    with:
      version: ${{ inputs.version || '5.15.104.4' }}
