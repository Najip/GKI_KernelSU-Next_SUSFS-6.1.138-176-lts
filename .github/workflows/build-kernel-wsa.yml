name: Build Kernel - WSA

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Kernel source"
        type: choice
        options:
          - "latest-ms"
          - "latest-android"
          - "compat-ognisty"
        default: "latest-ms"

      kernel_build_version:
        description: "Kernel family"
        type: choice
        options:
          - "5.15.x"
        default: "5.15.x"

      os_patch_level:
        description: "Patch level or date label (examples: latest, 104, 104.4, 105, 2025-01)"
        type: string
        default: "latest"

      brand_name:
        description: "Kernel branding"
        type: string
        default: "WSA"

      use_cache:
        description: "Use compiler cache"
        type: boolean
        default: true

      root_flavor:
        description: "Root flavor"
        type: choice
        options:
          - "KernelSU-Next"
          - "KernelSU"
          - "BakaSU"
          - "No Root"
        default: "KernelSU-Next"

      commit_mode:
        description: "Commit mode"
        type: choice
        options:
          - "verified"
          - "latest"
          - "update"
        default: "verified"

      release_type:
        description: "Release type"
        type: choice
        options:
          - "Action"
          - "Pre-Release"
          - "Release"
        default: "Action"

      enable_susfs:
        description: "Enable SUSFS"
        type: boolean
        default: false

      enable_nomount:
        description: "Enable NoMount"
        type: boolean
        default: false

      enable_baseband_guard:
        description: "Enable Baseband Guard"
        type: boolean
        default: false

      enable_bbr:
        description: "Enable BBR"
        type: boolean
        default: false

      enable_bpf:
        description: "Enable BPF"
        type: boolean
        default: false

      enable_perf:
        description: "Enable performance tuning"
        type: boolean
        default: false

      enable_ntsync:
        description: "Enable NTSync"
        type: boolean
        default: false

      extra_makeflags:
        description: "Extra make flags"
        type: string
        default: ""

  push:
    branches: ["main", "ci", "checkci"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - "kernel/**"

  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-kernel-wsa.yml"
      - "kernel/**"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      resolved_ref: ${{ steps.resolve.outputs.resolved_ref }}
      ref_target: ${{ steps.resolve.outputs.ref_target }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve source + ref
        id: resolve
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE="${{ inputs.source }}"
          PATCH="${{ inputs.os_patch_level }}"
          PATCH="${PATCH:-latest}"

          choose_ref() {
            local repo_url="$1"
            local patch_value="$2"

            if [ "$patch_value" = "latest" ] || [ -z "$patch_value" ]; then
              git ls-remote --heads --tags "$repo_url" \
                | awk '{print $2}' \
                | grep -E '5\\.15|latte|android-lts|linux-msft|android.*5\\.15' \
                | sort -V \
                | tail -n 1
              return
            fi

            local candidates=(
              "$patch_value"
              "5.15.${patch_value}"
              "v5.15.${patch_value}"
              "android-lts/latte-2/5.15.${patch_value}"
              "android-lts/latte-2/${patch_value}"
              "android-lts/latte-2/${patch_value#refs/heads/}"
              "linux-msft-wsa-${patch_value}"
              "linux-msft-wsa-5.15.${patch_value}"
              "refs/heads/${patch_value}"
              "refs/tags/${patch_value}"
              "refs/heads/5.15.${patch_value}"
              "refs/tags/5.15.${patch_value}"
            )

            local ref=""
            for candidate in "${candidates[@]}"; do
              [ -z "$candidate" ] && continue
              if git ls-remote --exit-code --heads --tags "$repo_url" "$candidate" >/dev/null 2>&1; then
                ref="$candidate"
                break
              fi
            done

            if [ -n "$ref" ]; then
              echo "$ref"
            else
              git ls-remote --heads --tags "$repo_url" \
                | awk '{print $2}' \
                | grep -E '5\\.15|latte|android-lts|linux-msft|android.*5\\.15' \
                | sort -V \
                | tail -n 1
            fi
          }

          case "$SOURCE" in
            latest-ms)
              echo "source=latest-ms" >> "$GITHUB_OUTPUT"
              REF="$(choose_ref https://github.com/microsoft/WSA-Linux-Kernel.git "$PATCH")"
              if [ -z "$REF" ]; then REF="main"; fi
              echo "resolved_ref=$REF" >> "$GITHUB_OUTPUT"
              echo "ref_target=$REF" >> "$GITHUB_OUTPUT"
              echo "version=latest-ms" >> "$GITHUB_OUTPUT"
              ;;
            latest-android)
              echo "source=latest-android" >> "$GITHUB_OUTPUT"
              REF="$(choose_ref https://android.googlesource.com/kernel/common.git "$PATCH")"
              if [ -z "$REF" ]; then REF="refs/heads/main"; fi
              echo "resolved_ref=$REF" >> "$GITHUB_OUTPUT"
              echo "ref_target=$REF" >> "$GITHUB_OUTPUT"
              echo "version=latest-android" >> "$GITHUB_OUTPUT"
              ;;
            compat-ognisty)
              echo "source=compat-ognisty" >> "$GITHUB_OUTPUT"
              echo "resolved_ref=main" >> "$GITHUB_OUTPUT"
              echo "ref_target=main" >> "$GITHUB_OUTPUT"
              echo "version=compat-ognisty" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown source: $SOURCE"
              exit 1
              ;;
          esac

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Info
        shell: bash
        run: |
          echo "source=${{ needs.prepare.outputs.source }}"
          echo "resolved_ref=${{ needs.prepare.outputs.resolved_ref }}"
          echo "ref_target=${{ needs.prepare.outputs.ref_target }}"
          echo "version=${{ needs.prepare.outputs.version }}"
          echo "kernel_build_version=${{ inputs.kernel_build_version }}"
          echo "os_patch_level=${{ inputs.os_patch_level }}"
          echo "brand_name=${{ inputs.brand_name }}"
          echo "release_type=${{ inputs.release_type }}"
          echo "use_cache=${{ inputs.use_cache }}"
          echo "root_flavor=${{ inputs.root_flavor }}"
          echo "commit_mode=${{ inputs.commit_mode }}"
          echo "enable_susfs=${{ inputs.enable_susfs }}"
          echo "enable_nomount=${{ inputs.enable_nomount }}"
          echo "enable_baseband_guard=${{ inputs.enable_baseband_guard }}"
          echo "enable_bbr=${{ inputs.enable_bbr }}"
          echo "enable_bpf=${{ inputs.enable_bpf }}"
          echo "enable_perf=${{ inputs.enable_perf }}"
          echo "enable_ntsync=${{ inputs.enable_ntsync }}"
          echo "extra_makeflags=${{ inputs.extra_makeflags }}"

      - name: Install full host + LLVM toolchain
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            clang-14 lld-14 llvm-14 \
            binutils-x86-64-linux-gnu \
            bc bison flex libelf-dev \
            curl wget ca-certificates ccache \
            xz-utils

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-14 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-14 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-14 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-14 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-14 100

      - name: Restore ccache
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            /tmp/ccache
          key: wsa-kernel-${{ needs.prepare.outputs.source }}-${{ github.ref_name }}
          restore-keys: |
            wsa-kernel-${{ needs.prepare.outputs.source }}-
            wsa-kernel-
          enableCrossOsArchive: true

      - name: Checkout KernelSU-Next
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: dev
          path: KernelSU
          fetch-depth: 0

      - name: Clone chosen kernel source
        shell: bash
        run: |
          set -euxo pipefail

          case "${{ needs.prepare.outputs.source }}" in
            latest-ms)
              git clone --depth 1 https://github.com/microsoft/WSA-Linux-Kernel.git WSA-Linux-Kernel
              ;;
            latest-android)
              git clone --depth 1 https://android.googlesource.com/kernel/common.git WSA-Linux-Kernel
              ;;
            compat-ognisty)
              git clone --depth 1 https://github.com/Ognisty321/WSA-Linux-Kernel.git WSA-Linux-Kernel
              ;;
            *)
              echo "Unsupported source"
              exit 1
              ;;
          esac

      - name: Checkout specific ref if provided
        working-directory: WSA-Linux-Kernel
        shell: bash
        run: |
          set -euxo pipefail
          REF="${{ needs.prepare.outputs.ref_target }}"
          if [ -n "$REF" ] && [ "$REF" != "main" ] && [ "$REF" != "refs/heads/main" ]; then
            git fetch --depth 1 origin "$REF" || true
            git checkout -B build-ref "$REF" || git checkout "$REF" || true
          fi

      - name: Setup Ccache
        if: ${{ inputs.use_cache }}
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: WSA-Kernel-${{ needs.prepare.outputs.source }}-x86_64
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          max-size: 2G

      - name: Apply compatibility patch overlays
        working-directory: WSA-Linux-Kernel
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d "$GITHUB_WORKSPACE/kernel/patches" ]; then
            find "$GITHUB_WORKSPACE/kernel/patches" -maxdepth 1 -type f -name '*.patch' -print | sort | while read -r patch; do
              echo "Applying $patch"
              git apply "$patch" || echo "Patch skipped: $patch"
            done
          fi

      - name: Setup KernelSU integration
        working-directory: WSA-Linux-Kernel
        shell: bash
        run: |
          set -euxo pipefail

          KERNEL_ROOT="$GITHUB_WORKSPACE/WSA-Linux-Kernel"

          echo "[+] Copy KernelSU driver"
          ln -sfn "$GITHUB_WORKSPACE/KernelSU/kernel" "$KERNEL_ROOT/drivers/kernelsu"

          DRIVER_MAKEFILE="$KERNEL_ROOT/drivers/Makefile"
          DRIVER_KCONFIG="$KERNEL_ROOT/drivers/Kconfig"
          grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
          grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"

          PATCH_DIR="$GITHUB_WORKSPACE/KernelSU/.github/patches/5.15"
          if [ -d "$PATCH_DIR" ]; then
            shopt -s nullglob
            PATCHES=("$PATCH_DIR"/*.patch)
            if [ ${#PATCHES[@]} -gt 0 ]; then
              echo "[+] Applying KernelSU patches"
              git apply "${PATCHES[@]}" || true
            else
              echo "[-] No KernelSU 5.15 patches found"
            fi
          else
            echo "[-] No patch directory at $PATCH_DIR"
          fi

          cd "$GITHUB_WORKSPACE/KernelSU"
          VERSION=$(($(git rev-list --count HEAD) + 10200))
          echo "VERSION: $VERSION"
          echo "kernelsu_version=$VERSION" >> "$GITHUB_ENV"

      - name: Apply optional WSA feature toggles
        working-directory: WSA-Linux-Kernel
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ inputs.enable_bbr }}" = "true" ]; then
            scripts/config --enable TCP_CONG_BBR 2>/dev/null || true
          fi

          if [ "${{ inputs.enable_bpf }}" = "true" ]; then
            scripts/config --enable BPF 2>/dev/null || true
          fi

          if [ "${{ inputs.enable_ntsync }}" = "true" ]; then
            scripts/config --enable NTSYNC 2>/dev/null || true
          fi

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "SUSFS requested; only applied if selected tree supports it."
          fi

          if [ "${{ inputs.enable_nomount }}" = "true" ]; then
            echo "NoMount requested; only applied if selected tree supports it."
          fi

          if [ "${{ inputs.enable_baseband_guard }}" = "true" ]; then
            echo "Baseband Guard requested; only applied if selected tree supports it."
          fi

          if [ "${{ inputs.enable_perf }}" = "true" ]; then
            echo "Performance tuning requested."
          fi

          make olddefconfig

      - name: Build WSA x86_64 kernel
        working-directory: WSA-Linux-Kernel
        shell: bash
        run: |
          set -euxo pipefail

          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump

          if [ -f "configs/wsa/config-wsa-x64" ]; then
            cp configs/wsa/config-wsa-x64 .config
          else
            ARCH=x86_64 make defconfig
          fi

          scripts/config --enable KSU_X86_PATCH_SYSCALL_DISPATCHER
          make olddefconfig

          EXTRA_FLAGS="${{ inputs.extra_makeflags }}"
          if [ -n "$EXTRA_FLAGS" ]; then
            echo "Using extra build flags: $EXTRA_FLAGS"
          fi

          make -j"$(nproc)" LLVM=1 ARCH=x86_64 \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            bzImage $EXTRA_FLAGS CCACHE="/usr/bin/ccache"

          OUTPUT_PATH="arch/x86/boot/bzImage"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "bzImage not found at $OUTPUT_PATH"
            find . -type f \( -name 'bzImage' -o -name 'Image' -o -name 'kernel' \) | head
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$OUTPUT_PATH" "$GITHUB_WORKSPACE/out/kernel"
          cp "$OUTPUT_PATH" "$GITHUB_WORKSPACE/out/bzImage"

      - name: Write build info
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cat > out/build-info.txt <<EOF
          source=${{ needs.prepare.outputs.source }}
          resolved_ref=${{ needs.prepare.outputs.resolved_ref }}
          ref_target=${{ needs.prepare.outputs.ref_target }}
          kernel_build_version=${{ inputs.kernel_build_version }}
          os_patch_level=${{ inputs.os_patch_level }}
          brand_name=${{ inputs.brand_name }}
          release_type=${{ inputs.release_type }}
          root_flavor=${{ inputs.root_flavor }}
          commit_mode=${{ inputs.commit_mode }}
          enable_susfs=${{ inputs.enable_susfs }}
          enable_nomount=${{ inputs.enable_nomount }}
          enable_baseband_guard=${{ inputs.enable_baseband_guard }}
          enable_bbr=${{ inputs.enable_bbr }}
          enable_bpf=${{ inputs.enable_bpf }}
          enable_perf=${{ inputs.enable_perf }}
          enable_ntsync=${{ inputs.enable_ntsync }}
          extra_makeflags=${{ inputs.extra_makeflags }}
          EOF

      - name: Upload raw kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ needs.prepare.outputs.source }}-x86_64-${{ needs.prepare.outputs.resolved_ref }}
          path: |
            out/kernel
            out/bzImage
            out/build-info.txt
          if-no-files-found: error
