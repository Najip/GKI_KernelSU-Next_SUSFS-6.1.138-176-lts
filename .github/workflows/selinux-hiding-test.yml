name: Build Kernel - Selinux hiding test

on:
  workflow_dispatch:
    inputs:
      root_flavor:
        description: "Root Flavor"
        type: choice
        options:
          - KernelSU
          - KernelSU-Next
          - BakaSU
          - All (KernelSU-Next + KernelSU + BakaSU)
        default: KernelSU
      use_susfs:
        description: "SUSFS"
        type: boolean
        default: true
      use_nomount:
        description: "NoMount"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      use_net:
        description: "Networking"
        type: boolean
        default: true
      use_ds:
        description: "DroidSpaces"
        type: boolean
        default: true
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: true
      use_ptrace:
        description: "Ptrace Patch"
        type: boolean
        default: true
      use_unicode:
        description: "Unicode Fix"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      use_perf:
        description: "Performance"
        type: boolean
        default: false
      brand_name:
        description: "Kernel Branding"
        type: string
        default: Wild
      os_patch_level:
        description: "Patch date (YYYY-MM), kernel sublevel, lts, or All"
        type: string
        default: All
      page_size:
        description: "ARM64 page size"
        type: choice
        options:
          - 4k
          - 16k
        default: 4k
      allow_version_mismatch:
        description: "Force-load modules with mismatched symbol versions"
        type: boolean
        default: false
      use_cache:
        description: "Use ccache/bazel cache"
        type: boolean
        default: true
      keep_kmi:
        description: "Keep stock KMI suffix"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  resolve-sources:
    runs-on: ubuntu-24.04
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      kernelsu_commit: ${{ steps.resolve.outputs.kernelsu_commit }}
      kernel_patches_commit: ${{ steps.resolve.outputs.kernel_patches_commit }}
      anykernel3_commit: ${{ steps.resolve.outputs.anykernel3_commit }}
      droidspaces_commit: ${{ steps.resolve.outputs.droidspaces_commit }}
      susfs_commit_android14_6_1: ${{ steps.resolve.outputs.susfs_commit_android14_6_1 }}
      feature_set: ${{ steps.features.outputs.feature_set }}
      root_matrix: ${{ steps.resolve.outputs.root_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve custom source commits
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          resolve_sha() {
            git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          emit() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ] || ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve $key (got: ${value:-empty})" >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          }

          # KernelSU fork override for selinux-hiding test builds
          KSU_FORK_REPO="https://github.com/Najip/KernelSU.git"
          KSU_NEXT_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
          BAKASU_REPO="https://github.com/Baka-SU/BakaSU.git"
          NOMOUNT_REPO="https://github.com/maxsteeel/nomount.git"
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          KERNEL_PATCHES_REPO="https://github.com/WildKernels/kernel_patches.git"
          ANYKERNEL_REPO="https://github.com/WildKernels/AnyKernel3.git"
          DROIDSPACES_REPO="https://github.com/ravindu644/Droidspaces-OSS.git"

          NOMOUNT_COMMIT="$(resolve_sha "$NOMOUNT_REPO" refs/heads/dev)"
          KSU_FORK_COMMIT="$(resolve_sha "$KSU_FORK_REPO" refs/heads/main)"
          KSU_NEXT_COMMIT="$(resolve_sha "$KSU_NEXT_REPO" refs/heads/dev)"
          BAKASU_COMMIT="$(resolve_sha "$BAKASU_REPO" refs/heads/main)"
          SUSFS_614="$(resolve_sha "$SUSFS_REPO" refs/heads/gki-android14-6.1)"
          KERNEL_PATCHES_COMMIT="$(resolve_sha "$KERNEL_PATCHES_REPO" refs/heads/main)"
          ANYKERNEL_COMMIT="$(resolve_sha "$ANYKERNEL_REPO" refs/heads/gki-2.0)"
          DROIDSPACES_COMMIT="$(resolve_sha "$DROIDSPACES_REPO" refs/heads/main)"

          emit nomount_commit "$NOMOUNT_COMMIT"
          emit kernelsu_commit "$KSU_FORK_COMMIT"
          emit susfs_commit_android14_6_1 "$SUSFS_614"
          emit kernel_patches_commit "$KERNEL_PATCHES_COMMIT"
          emit anykernel3_commit "$ANYKERNEL_COMMIT"
          emit droidspaces_commit "$DROIDSPACES_COMMIT"

          mk_entry() {
            printf '{"root_flavor":"%s","variant":"%s","root_commit":"%s","produce":%s}' "$1" "$2" "$3" "$4"
          }

          case "${{ inputs.root_flavor || 'KernelSU' }}" in
            KernelSU)
              ROOT_MATRIX="[$(mk_entry kernelsu KernelSU "$KSU_FORK_COMMIT" true)]"
              ;;
            KernelSU-Next)
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$KSU_NEXT_COMMIT" true)]"
              ;;
            BakaSU)
              ROOT_MATRIX="[$(mk_entry bakasu BakaSU "$BAKASU_COMMIT" true)]"
              ;;
            "All (KernelSU-Next + KernelSU + BakaSU)")
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$KSU_NEXT_COMMIT" true),$(mk_entry kernelsu KernelSU "$KSU_FORK_COMMIT" false),$(mk_entry bakasu BakaSU "$BAKASU_COMMIT" false)]"
              ;;
            *)
              echo "ERROR: unknown root_flavor '${{ inputs.root_flavor }}'" >&2
              exit 1
              ;;
          esac

          echo "root_matrix=$ROOT_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Compose feature set
        id: features
        shell: bash
        run: |
          set -euo pipefail

          F_SUSFS="${{ inputs.use_susfs }}"
          F_NOMOUNT="${{ inputs.use_nomount }}"
          F_BBG="${{ inputs.use_bbg }}"
          F_NET="${{ inputs.use_net }}"
          F_DS="${{ inputs.use_ds }}"
          F_NTSYNC="${{ inputs.use_ntsync }}"
          F_PTRACE="${{ inputs.use_ptrace }}"
          F_UNICODE="${{ inputs.use_unicode }}"
          F_BPF="${{ inputs.use_bpf }}"
          F_PERF="${{ inputs.use_perf }}"

          FEATURES=""
          [ "$F_SUSFS" = "true" ] && FEATURES="${FEATURES}SUSFS+"
          [ "$F_NOMOUNT" = "true" ] && FEATURES="${FEATURES}NoMount+"
          [ "$F_BBG" = "true" ] && FEATURES="${FEATURES}BBG+"
          [ "$F_NET" = "true" ] && FEATURES="${FEATURES}NET+"
          [ "$F_DS" = "true" ] && FEATURES="${FEATURES}DS+"
          [ "$F_NTSYNC" = "true" ] && FEATURES="${FEATURES}NTSync+"
          [ "$F_PTRACE" = "true" ] && FEATURES="${FEATURES}Ptrace+"
          [ "$F_UNICODE" = "true" ] && FEATURES="${FEATURES}Unicode+"
          [ "$F_BPF" = "true" ] && FEATURES="${FEATURES}BPF+"
          [ "$F_PERF" = "true" ] && FEATURES="${FEATURES}Perf+"
          echo "feature_set=${FEATURES%+}" >> "$GITHUB_OUTPUT"

  build-android14-6-1:
    needs: resolve-sources
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.resolve-sources.outputs.root_matrix) }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-6.1.json
      feature_set: ${{ needs.resolve-sources.outputs.feature_set }}
      susfs_commit: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1 }}
      nomount_commit: ${{ needs.resolve-sources.outputs.nomount_commit }}
      kernel_patches_commit: ${{ needs.resolve-sources.outputs.kernel_patches_commit }}
      root_flavor: ${{ matrix.root.root_flavor }}
      produce_stock_configs: ${{ matrix.root.produce }}
      root_commit: ${{ matrix.root.root_commit }}
      variant: ${{ matrix.root.variant }}
      ksu_branch: ${{ needs.resolve-sources.outputs.kernelsu_commit }}
      anykernel3_commit: ${{ needs.resolve-sources.outputs.anykernel3_commit }}
      droidspaces_commit: ${{ needs.resolve-sources.outputs.droidspaces_commit }}
      brand_name: ${{ inputs.brand_name || 'Wild' }}
      keep_kmi: ${{ inputs.keep_kmi || false }}
      os_patch_level: ${{ inputs.os_patch_level || 'All' }}
      allow_version_mismatch: ${{ inputs.allow_version_mismatch || false }}
      use_cache: ${{ inputs.use_cache || true }}
      page_size: ${{ inputs.page_size || '4k' }}
    secrets: inherit
